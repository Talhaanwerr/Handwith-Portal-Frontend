<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Check</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ee; --ok:#1f9d55; --bad:#d64545; --accent:#3b6fd8; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  .tally span { margin-left:10px; font-weight:600; }
  .tally .ok { color:var(--ok); } .tally .bad { color:var(--bad); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .row { display:grid; grid-template-columns:44px 1fr auto auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:6px; }
  .row.ok { border-color:var(--ok); background:#f0fbf4; }
  .row.bad { border-color:var(--bad); background:#fdf1f1; }
  .row.missing { background:#fffbea; border-style:dashed; }
  .seg { color:var(--muted); font-size:13px; text-align:right; }
  .word { font-size:20px; font-weight:700; }
  .path { display:block; font-size:12px; color:var(--muted); font-weight:400; word-break:break-all; }
  audio { height:32px; width:220px; }
  .marks button { padding:4px 10px; }
  .marks .yes.on { background:var(--ok); color:#fff; border-color:var(--ok); }
  .marks .no.on { background:var(--bad); color:#fff; border-color:var(--bad); }
  .note { color:var(--muted); font-size:13px; }
  @media (max-width:640px) {
    .row { grid-template-columns:36px 1fr; }
    audio { width:100%; grid-column:1 / -1; }
    .marks { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Audio check</h1>
  <div class="tally">Right <span class="ok" id="ok">0</span> Wrong <span class="bad" id="bad">0</span> Unchecked <span id="left">0</span></div>
  <button id="playAll" type="button">Play all in order</button>
  <button id="reset" type="button">Clear marks</button>
</header>
<main>
  <p class="note">Play each clip and mark whether it says the word shown. Marks stay in this browser. "Play all" runs through every clip so you can listen along.</p>
  <div id="list"></div>
</main>
<script>

const COPIES = [{word:"sh (copy of #1)",path:"public/audio/blend/sound-level2-ship-0.mp3"},{word:"ou (copy of #5)",path:"public/audio/blend/sound-level3-mouse-1.mp3"}];
const B4 = [{"word":"t-t-t... ieeee... ttieee","path":"public/audio/blend/merge-level5-tie.mp3"},{"word":"t-t-t... oyyyy... sssss... ttoyyyssss","path":"public/audio/blend/merge-level5-toys.mp3"},{"word":"uuuuu... nnnnn... iiiii... c-c-c... orrrr... nnnnn... uuuunnnniiiiccorrrnnnn","path":"public/audio/blend/merge-level5-unicorn.mp3"},{"word":"Sound out the word at the top of the screen, then select the picture that matches the word.","path":"public/audio/blend/instructions.mp3"},{"word":"Hint: Click on the letter, or the sound button beneath it, to hear the sound that the letter makes!","path":"public/audio/blend/instructions-hint.mp3"},{"word":"Choose a level to practise.","path":"public/audio/blend/menu.mp3"},{"word":"Blend & Seek! Levels 1 to 5 phonics.","path":"public/audio/blend/title.mp3"},{"word":"Great work! You matched up all the words and pictures correctly. Would you like to play again?","path":"public/audio/blend/well-done.mp3"},{"word":"ah - alligator","path":"public/audio/treats/blend-alligator.mp3"},{"word":"puh - penguin","path":"public/audio/treats/blend-penguin.mp3"},{"word":"dig","path":"public/audio/words/dig.mp3"},{"word":"hop","path":"public/audio/words/hop.mp3"},{"word":"man","path":"public/audio/words/man.mp3"},{"word":"mat","path":"public/audio/words/mat.mp3"},{"word":"peg","path":"public/audio/words/peg.mp3"},{"word":"sit","path":"public/audio/words/sit.mp3"},{"word":"sock","path":"public/audio/words/sock.mp3"},{"word":"tap","path":"public/audio/words/tap.mp3"},{"word":"tin","path":"public/audio/words/tin.mp3"},{"word":"Click the word that matches the picture.","path":"public/audio/instructions/click-the-word.mp3"},{"word":"Tap Play to start.","path":"public/audio/instructions/tap-play.mp3"},{"word":"Pick easy, medium or hard.","path":"public/audio/instructions/safari-pick-level.mp3"},{"word":"Count them all. Then tap the number.","path":"public/audio/instructions/safari-count.mp3"},{"word":"Which number is missing?","path":"public/audio/instructions/safari-missing.mp3"},{"word":"Drag the number to the empty spot.","path":"public/audio/instructions/safari-drag.mp3"},{"word":"Pick a vowel to build with.","path":"public/audio/instructions/site-pick-vowel.mp3"},{"word":"Read the word. Drag it to its picture.","path":"public/audio/instructions/site-drag-word.mp3"},{"word":"Say each sound, then blend them together.","path":"public/audio/instructions/site-blend.mp3"},{"word":"The site is built!","path":"public/audio/instructions/site-built.mp3"},{"word":"Pick a sorting game.","path":"public/audio/instructions/sort-pick.mp3"},{"word":"Is it big or small? Drag it to the right box.","path":"public/audio/instructions/sort-size.mp3"},{"word":"Where does it live? Drag it home.","path":"public/audio/instructions/sort-home.mp3"},{"word":"Everything is sorted!","path":"public/audio/instructions/sort-done.mp3"},{"word":"Look at the picture. Tap the word that names it.","path":"public/audio/instructions/snow-tap-word.mp3"},{"word":"Let's see how you did!","path":"public/audio/instructions/snow-review.mp3"}];
const B5 = [{"word":"sssss... p-p-p... ooooo... nnnnn... ssssppoooonnnn","path":"public/audio/blend/merge-level3-spoon.mp3"},{"word":"t-t-t... oeeee... sssss... ttoeeessss","path":"public/audio/blend/merge-level3-toes.mp3"},{"word":"t-t-t... rrrrr... aiiii... nnnnn... ttrrrraiiinnnn","path":"public/audio/blend/merge-level3-train.mp3"},{"word":"b-b-b... rrrrr... uuuuu... shhhh... bbrrrruuuushhh","path":"public/audio/blend/merge-level4-brush.mp3"},{"word":"ch-ch-ch... airrrr... chchairrr","path":"public/audio/blend/merge-level4-chair.mp3"},{"word":"ch-ch-ch... eeeee... sssss... chcheeeessss","path":"public/audio/blend/merge-level4-cheese.mp3"},{"word":"c-c-c... lllll... ooooo... ck-ck-ck... cclllloooockck","path":"public/audio/blend/merge-level4-clock.mp3"},{"word":"c-c-c... rrrrr... owwww... nnnnn... ccrrrrowwwnnnn","path":"public/audio/blend/merge-level4-crown.mp3"},{"word":"qu-qu-qu... eeeee... nnnnn... ququeeeennnn","path":"public/audio/blend/merge-level4-queen.mp3"},{"word":"shhhh... oeeee... shhhoeee","path":"public/audio/blend/merge-level4-shoe.mp3"},{"word":"t-t-t... eeeee... thhhh... tteeeethhh","path":"public/audio/blend/merge-level4-teeth.mp3"},{"word":"thhhh... uuuuu... mmmmm... thhhuuuummmm","path":"public/audio/blend/merge-level4-thumb.mp3"},{"word":"whhhh... aaaaa... lllll... whhhaaaallll","path":"public/audio/blend/merge-level4-whale.mp3"},{"word":"b-b-b... iiiii... k-k-k... bbiiiikk","path":"public/audio/blend/merge-level5-bike.mp3"},{"word":"ch-ch-ch... eeeee... fffff... chcheeeeffff","path":"public/audio/blend/merge-level5-chef.mp3"},{"word":"c-c-c... lllll... ouuuu... d-d-d... ccllllouuudd","path":"public/audio/blend/merge-level5-cloud.mp3"},{"word":"c-c-c... uuuuu... b-b-b... ccuuuubb","path":"public/audio/blend/merge-level5-cube.mp3"},{"word":"lllll... iiiii... ooooo... nnnnn... lllliiiioooonnnn","path":"public/audio/blend/merge-level5-lion.mp3"},{"word":"mmmmm... eaaaa... t-t-t... mmmmeaaatt","path":"public/audio/blend/merge-level5-meat.mp3"},{"word":"sssss... nnnnn... aaaaa... k-k-k... ssssnnnnaaaakk","path":"public/audio/blend/merge-level5-snake.mp3"}];
const B6 = [{"word":"apple","path":"public/audio/names/apple.mp3"},{"word":"ball","path":"public/audio/names/ball.mp3"},{"word":"banana","path":"public/audio/names/banana.mp3"},{"word":"box","path":"public/audio/names/box.mp3"},{"word":"bus","path":"public/audio/names/bus.mp3"},{"word":"cake","path":"public/audio/names/cake.mp3"},{"word":"car","path":"public/audio/names/car.mp3"},{"word":"cat","path":"public/audio/names/cat.mp3"},{"word":"cup","path":"public/audio/names/cup.mp3"},{"word":"dog","path":"public/audio/names/dog.mp3"},{"word":"drum","path":"public/audio/names/drum.mp3"},{"word":"egg","path":"public/audio/names/egg.mp3"},{"word":"fan","path":"public/audio/names/fan.mp3"},{"word":"flag","path":"public/audio/names/flag.mp3"},{"word":"fox","path":"public/audio/names/fox.mp3"},{"word":"frog","path":"public/audio/names/frog.mp3"},{"word":"grapes","path":"public/audio/names/grapes.mp3"},{"word":"hat","path":"public/audio/names/hat.mp3"},{"word":"hen","path":"public/audio/names/hen.mp3"},{"word":"house","path":"public/audio/names/house.mp3"},{"word":"jam","path":"public/audio/names/jam.mp3"},{"word":"jar","path":"public/audio/names/jar.mp3"},{"word":"jelly","path":"public/audio/names/jelly.mp3"},{"word":"jet","path":"public/audio/names/jet.mp3"},{"word":"juice","path":"public/audio/names/juice.mp3"},{"word":"lemon","path":"public/audio/names/lemon.mp3"},{"word":"lion","path":"public/audio/names/lion.mp3"},{"word":"milk","path":"public/audio/names/milk.mp3"},{"word":"mouse","path":"public/audio/names/mouse.mp3"},{"word":"nest","path":"public/audio/names/nest.mp3"},{"word":"net","path":"public/audio/names/net.mp3"},{"word":"nut","path":"public/audio/names/nut.mp3"},{"word":"orange","path":"public/audio/names/orange.mp3"},{"word":"pen","path":"public/audio/names/pen.mp3"},{"word":"penguin","path":"public/audio/names/penguin.mp3"},{"word":"pineapple","path":"public/audio/names/pineapple.mp3"},{"word":"pizza","path":"public/audio/names/pizza.mp3"},{"word":"queen","path":"public/audio/names/queen.mp3"},{"word":"shoe","path":"public/audio/names/shoe.mp3"},{"word":"six","path":"public/audio/names/six.mp3"},{"word":"snake","path":"public/audio/names/snake.mp3"},{"word":"soup","path":"public/audio/names/soup.mp3"},{"word":"sun","path":"public/audio/names/sun.mp3"},{"word":"train","path":"public/audio/names/train.mp3"},{"word":"van","path":"public/audio/names/van.mp3"},{"word":"water","path":"public/audio/names/water.mp3"},{"word":"whale","path":"public/audio/names/whale.mp3"},{"word":"zip","path":"public/audio/names/zip.mp3"},{"word":"zucchini","path":"public/audio/names/zucchini.mp3"},{"word":"Let's sort by colour! Put each food with its colour.","path":"public/audio/instructions/food-colours.mp3"},{"word":"Let's sort by shape! Put each one with its shape.","path":"public/audio/instructions/food-shapes.mp3"},{"word":"Let's sort by size! Find where each one fits.","path":"public/audio/instructions/food-sizes.mp3"},{"word":"Let's sort the kitchen! Where does each one go?","path":"public/audio/instructions/food-kitchen.mp3"},{"word":"Is it food or a toy?","path":"public/audio/instructions/food-toys.mp3"},{"word":"Do we drink it or eat it?","path":"public/audio/instructions/food-drink.mp3"},{"word":"Is it hot or cold?","path":"public/audio/instructions/food-hot.mp3"},{"word":"Is it fruit or a treat?","path":"public/audio/instructions/food-fruit.mp3"}];
const SECTIONS = [
  { title: "Batch 1: words (35)", items: B1 },
  { title: "Batch 2: numbers (7)", items: NUMS, offset: 0 },
  { title: "Batch 2: Blend & Seek words (26)", items: BLEND, offset: 7 },
  { title: "Batch 3: letter sounds (30)", items: SOUNDS },
  { title: "Batch 3: stretched blends (27)", items: MERGES, offset: 30 },
  { title: "Batch 3: duplicate sounds, copied", items: COPIES, offset: 57 },
  { title: "Batch 4: blends, screen lines, words, instructions (35)", items: B4 },
  { title: "Batch 5: stretched blends spoon to snake (20)", items: B5 },
  { title: "Batch 6: clean game words (49) + Food Sort lines (8)", items: B6 },
];
const MISSING = [];

const KEY = "audio-check-marks";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch {} };

const list = document.getElementById("list");
const players = [];

function row(item, seg) {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `
    <div class="seg">#${seg}</div>
    <div class="word"></div>
    <audio controls preload="none"></audio>
    <div class="marks"><button type="button" class="yes">Right</button> <button type="button" class="no">Wrong</button></div>`;
  el.querySelector(".word").textContent = item.word;
  const p = document.createElement("span"); p.className = "path"; p.textContent = item.path;
  el.querySelector(".word").append(p);
  const audio = el.querySelector("audio"); audio.src = item.path;
  players.push(audio);
  const paint = () => {
    const m = marks[item.path];
    el.classList.toggle("ok", m === "ok"); el.classList.toggle("bad", m === "bad");
    el.querySelector(".yes").classList.toggle("on", m === "ok");
    el.querySelector(".no").classList.toggle("on", m === "bad");
    tally();
  };
  el.querySelector(".yes").onclick = () => { marks[item.path] = marks[item.path] === "ok" ? undefined : "ok"; save(); paint(); };
  el.querySelector(".no").onclick = () => { marks[item.path] = marks[item.path] === "bad" ? undefined : "bad"; save(); paint(); };
  paint();
  return el;
}

const all = [];
for (const s of SECTIONS) {
  const h = document.createElement("h2"); h.textContent = s.title; list.append(h);
  s.items.forEach((item, i) => { all.push(item); list.append(row(item, (s.offset ?? 0) + i + 1)); });
}
if (MISSING.length) { const hm = document.createElement("h2"); hm.textContent = "Not recorded yet"; list.append(hm); }
for (const m of MISSING) {
  const el = document.createElement("div"); el.className = "row missing";
  el.innerHTML = `<div class="seg">–</div><div class="word"></div><div class="note"></div><div></div>`;
  el.querySelector(".word").textContent = m.word;
  const p = document.createElement("span"); p.className = "path"; p.textContent = m.path;
  el.querySelector(".word").append(p);
  el.querySelector(".note").textContent = m.why;
  list.append(el);
}

function tally() {
  const v = Object.values(marks);
  const ok = v.filter((x) => x === "ok").length, bad = v.filter((x) => x === "bad").length;
  document.getElementById("ok").textContent = ok;
  document.getElementById("bad").textContent = bad;
  document.getElementById("left").textContent = Math.max(0, all.length - ok - bad);
}
tally();

document.getElementById("reset").onclick = () => { marks = {}; save(); location.reload(); };
document.getElementById("playAll").onclick = async () => {
  for (const a of players) {
    a.closest(".row").scrollIntoView({ block: "center", behavior: "smooth" });
    a.currentTime = 0;
    try { await a.play(); } catch { continue; }
    await new Promise((r) => { a.onended = r; a.onerror = r; });
    await new Promise((r) => setTimeout(r, 400));
  }
};
</script>
</body>
</html>
